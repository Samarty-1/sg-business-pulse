name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dagster definitions load
        run: dagster definitions validate -m pulse.definitions
      - name: Tests (fixture releases, fake HTTP, full Dagster runs)
        run: pytest
